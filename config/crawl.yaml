# Responsible crawling of official campground websites. Seeds come from source records.

politeness:
  download_delay_s: 2.0          # per domain, plus AutoThrottle
  concurrent_per_domain: 1
  timeout_s: 20
  max_bytes: 5000000             # DOWNLOAD_MAXSIZE
  retry_times: 3
  max_retry_after_s: 120         # longer Retry-After: give up on the page, don't block the crawl

scope:
  max_depth: 2
  max_pages_per_site: 6
  # Hosts that serve many locations: a deep seed URL limits the crawl to its own path subtree
  # (and, when the path is generic, to the seed's identifying query parameters).
  multi_location_hosts: [fs.usda.gov, parks.ca.gov, travelyosemite.com, autocamp.com,
                         koa.com, thousandtrails.com, yosemiteresorts.com]
  include_keywords: [camp, rv, site, amenit, rate, fee, price, reserv, season, hour, faq, map,
                     facilit, about, contact, info, policies, rules]
  exclude_keywords: [blog, news, event, cart, checkout, login, signin, account, privacy, terms,
                     calendar, wp-json, feed, tag/, author/, gallery, photo, career, job]
  exclude_query_params: [date, month, year, checkin, checkout, start, end, arrival, departure,
                         replytocom, share]

skip_domains:                    # covered by APIs, or not an official source
  api_sources: [nps.gov, recreation.gov]
  aggregators_and_reviews: [hipcamp.com, thedyrt.com, campendium.com, tripadvisor.com, yelp.com,
                            google.com, goo.gl, booking.com, expedia.com, airbnb.com, vrbo.com,
                            koa.com/campgrounds/search, campgroundreviews.com, rvparky.com,
                            freecampsites.net, ioverlander.com]
  not_official: [climber.org, wikipedia.org, wikidata.org, facebook.com, instagram.com]

booking_platforms:               # never followed; recorded as an attribute of the campground
  recreation.gov: recreation.gov
  reserveamerica.com: reserveamerica
  reservecalifornia.com: reservecalifornia
  campspot.com: campspot
  newbook.cloud: newbook
  firefly-reservations.com: firefly
  roverpass.com: roverpass
  staylist.com: staylist
  resnexus.com: resnexus
  itinio.com: itinio
  checkfront.com: checkfront
  bookingcenter.com: bookingcenter
  thinkreservations.com: thinkreservations
  cloudbeds.com: cloudbeds
  webrezpro.com: webrezpro

render:
  min_static_text_chars: 400     # below this, with no embedded JSON, a page is "too thin"
