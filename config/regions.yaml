# Regions are configuration. bbox = [south, west, north, east] (WGS84, Overpass order).
sierra:
  description: Yosemite NP, Eastern Sierra (Mammoth Lakes, June Lake, Bridgeport) and gateway towns
  bbox: [37.30, -120.30, 38.30, -118.80]
  states: [CA, NV]
  nps_park_codes: [yose, depo]

# A second region, defined but not ingested or crawled: every number in the docs is `sierra`.
tahoe:
  description: Lake Tahoe basin and surroundings
  bbox: [38.70, -120.30, 39.40, -119.80]
  states: [CA, NV]
  nps_park_codes: []
