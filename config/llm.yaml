# LLM providers for extraction. Claude is the primary provider: Haiku extracts, Sonnet handles
# the escalations. The Gemini adapter is an optional alternative
# (`uv sync --extra gemini`, then `--provider gemini`).
provider: anthropic
max_output_tokens: 4096
escalation:
  max_ungrounded_share: 0.25   # more than this share of checkable values ungrounded -> retry on the strong model

anthropic:
  cheap: claude-haiku-5-5
  strong: claude-sonnet-5-5

gemini:                        # optional alternative provider
  cheap: gemini-3.5-flash-lite
  strong: gemini-3.6-flash
  thinking_level:              # lowest level each model allows ("minimal" = near-off)
    gemini-3.5-flash-lite: MINIMAL
    gemini-3.6-flash: MINIMAL
  # Free-tier quotas are per project and model and are shown in AI Studio, not in the docs.
  limits:
    gemini-3.5-flash-lite: {rpm: 10, tpm: 200000, rpd: 400}
    gemini-3.6-flash: {rpm: 5, tpm: 200000, rpd: 100}
