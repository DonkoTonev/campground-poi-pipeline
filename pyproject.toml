[project]
name = "campground-poi-pipeline"
version = "0.1.0"
description = "Campground POI pipeline: multi-source ingest, cost-aware LLM extraction, entity resolution, golden records, search."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "boto3>=1.44.10",
    "extruct>=0.18.0",
    "httpx>=0.28.1",
    "markdownify>=1.2.4",
    "phonenumbers>=9.0.44",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "rapidfuzz>=3.14.6",
    "scrapy>=2.20.0",
    "scrapy-playwright>=0.0.48",
    "selectolax>=1.0.2",
    "shapely>=2.2.0",
    "sqlalchemy>=2",
    "structlog>=26.1.0",
    "tenacity>=9.2.1",
    "tldextract>=5.4.0",
    "trafilatura>=2.4.0",
    "typer>=0.29.2",
]

[project.scripts]
poi = "poi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/poi"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PTH"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH", "E501"]  # parametrize tables read better unwrapped
"migrations/**" = ["N999"]
# SQL assembled from constant column tuples only; all values are bound parameters.
"src/poi/normalize/stage.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["poi"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "extruct.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
  # trafilatura imports urllib3's SOCKS support, which we do not use
  "ignore::urllib3.exceptions.DependencyWarning",
]
markers = [
  "integration: needs Postgres/PostGIS (docker compose up, or CI service)",
  "live: hits real external APIs; opt-in via POI_LIVE_TESTS=1",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.10",
    "moto[s3]>=5.2.6",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
    "types-shapely>=2.2.0.20261122",
]
