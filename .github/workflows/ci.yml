name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:17-3.7
        env:
          POSTGRES_USER: poi
          POSTGRES_PASSWORD: poi
          POSTGRES_DB: poi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poi -d poi"
          --health-interval 3s --health-timeout 3s --health-retries 20
      es:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports: ["9200:9200"]
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://poi:poi@localhost:5432/poi
      ELASTICSEARCH_URL: http://localhost:9200
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for the publication gate
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra gemini  # keep the optional Gemini adapter tested
      - run: uv run python scripts/check_publishable.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run pytest
