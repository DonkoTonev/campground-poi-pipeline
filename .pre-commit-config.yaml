default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=2000]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  # The repo is public: every push is a publication. Re-check the whole history before pushing.
  - repo: local
    hooks:
      - id: gitleaks-history
        name: gitleaks (full history)
        language: golang
        additional_dependencies: [github.com/zricethezav/gitleaks/v8@v8.30.0]
        entry: gitleaks git --redact --no-banner .
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: publishable-staged
        name: publication gate (staged changes)
        language: system
        entry: uv run python scripts/check_publishable.py --staged
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: publishable
        name: publication gate (paths, identities, emails, phones)
        language: system
        entry: uv run python scripts/check_publishable.py
        pass_filenames: false
        always_run: true
        stages: [pre-push]
